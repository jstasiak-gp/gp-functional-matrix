# Serwer statyczny katalogu funkcjonalności iMap.
# Port 8080 (nieuprzywilejowany). Zero proxy / zero zależności sieciowych.
server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    charset      utf-8;
    charset_types text/html text/css application/javascript application/json;

    root   /usr/share/nginx/html;
    index  index.html;

    # Poprawny typ i UTF-8 dla eksportu danych
    location = /combined.json {
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Kompresja (strona i JSON potrafią być duże)
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;

    # Bez listowania katalogów
    autoindex off;
}
